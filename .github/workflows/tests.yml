name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit suite
        run: PYTHONPATH=tests/stubs:src python -m unittest discover -s tests -p 'test_*.py' -v

  docker-ssh:
    name: Docker SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Docker-backed remote tests
        run: ./tests/integration/run.sh
