[metadata]
name = concert_launcher
version = 0.2.0
author = Arturo Laurenzi
author_email = arturo.laurenzi@iit.it
description = A minimal tool to automate local and remote process launching with dependencies
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ADVRHumanoids/concert_launcher
project_urls =
    Bug Tracker = https://github.com/ADVRHumanoids/concert_launcher/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find_namespace:
include_package_data = True
python_requires = >=3.6
install_requires =
    argcomplete
    pyyaml
    asyncssh

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    concert_launcher = concert_launcher.main:main

[tool:pytest]
markers =
    docker: requires Docker-backed SSH hosts
    chaos: interrupts SSH connectivity during an operation
    slow: long-running integration or soak test
asyncio_mode = auto
